<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NoirBitcoin History</title>

<link rel="stylesheet" href="style.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>


<body>


<header class="dashboard-header">

    <div class="logo">

        <h1>

            <i class="fa-brands fa-bitcoin"></i>

            NOIRBITCOIN

        </h1>

    </div>


    <div class="header-icons">

        <button
            class="icon-btn"
            onclick="window.location.href='dashboard.html'"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>

    </div>

</header>



<div class="dashboard-container">


    <div class="history-page">


        <div class="history-page-header">

            <div>

                <h2>
                    Transaction History
                </h2>

                <p>
                    Your recent investment activity
                </p>

            </div>

        </div>



        <div id="investmentHistory"></div>


    </div>


</div>

<script type="module">

import { auth } from "./firebase.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const db = getFirestore(auth.app);


// =========================================
// LOAD FIRESTORE INVESTMENT HISTORY
// =========================================


// =========================================
// LOAD ALL TRANSACTION HISTORY
// INVESTMENTS + TRADES
// =========================================

async function loadHistory(user) {

    const container =
        document.getElementById("investmentHistory");

    if (!container) return;

    container.innerHTML = "";

    try {

        // =========================================
        // LOAD INVESTMENTS
        // =========================================

        const investmentsQuery = query(
            collection(db, "investments"),
            where("userId", "==", user.uid)
        );

        const investmentSnapshot =
            await getDocs(investmentsQuery);

        const transactions = [];

        investmentSnapshot.forEach(function(doc) {

            transactions.push({

                id: doc.id,

                transactionType: "investment",

                ...doc.data()

            });

        });


        // =========================================
        // LOAD TRADES
        // =========================================

        const tradesQuery = query(
            collection(db, "trades"),
            where("userId", "==", user.uid)
        );

        const tradeSnapshot =
            await getDocs(tradesQuery);

        tradeSnapshot.forEach(function(doc) {

            transactions.push({

                id: doc.id,

                transactionType: "trade",

                ...doc.data()

            });

        });


        // =========================================
        // SORT NEWEST FIRST
        // =========================================

        transactions.sort(function(a, b) {

            return new Date(b.date) -
                   new Date(a.date);

        });


        // =========================================
        // NO TRANSACTIONS
        // =========================================

        if (transactions.length === 0) {

            container.innerHTML = `

                <div class="empty-history">

                    <div class="empty-history-icon">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                    </div>

                    <h3>
                        No Transactions Yet
                    </h3>

                    <p>
                        Your investment activity will appear here.
                    </p>

                </div>

            `;

            return;

        }


        // =========================================
        // DISPLAY ALL TRANSACTIONS
        // =========================================

        transactions.forEach(function(transaction) {

            const amount =
                Number(
                    transaction.amountUSD ??
                    transaction.amount ??
                    0
                );


            const formattedAmount =
                amount.toLocaleString("en-US", {

                    minimumFractionDigits: 2,

                    maximumFractionDigits: 2

                });


            let formattedDate =
                transaction.date || "N/A";


            if (transaction.date) {

                const date =
                    new Date(transaction.date);

                if (!isNaN(date.getTime())) {

                    formattedDate =
                        date.toLocaleString("en-US", {

                            day: "2-digit",

                            month: "short",

                            year: "numeric",

                            hour: "2-digit",

                            minute: "2-digit"

                        });

                }

            }


            // =========================================
            // TRADE
            // =========================================

            if (
                transaction.transactionType === "trade"
            ) {

                const isBuy =
                    String(
                        transaction.type || ""
                    ).toUpperCase() === "BUY";


                const sign =
                    isBuy ? "-" : "+";


                const colorClass =
                    isBuy
                        ? "history-amount-negative"
                        : "history-amount-positive";


                const transactionTitle =
                    isBuy
                        ? "Bought Bitcoin"
                        : "Sold Bitcoin";


                const btcAmount =
                    Number(
                        transaction.btcAmount
                    ) || 0;


                const bitcoinPrice =
                    Number(
                        transaction.price
                    ) || 0;


                const status =
                    transaction.status ||
                    "Completed";


                container.innerHTML += `

                <div class="website-history-item">

                    <div
                        class="website-history-header"
                        onclick="toggleHistory(this)"
                    >

                        <div class="website-history-left">

                            <div class="website-history-icon">

                                <img
                                    src="https://cryptologos.cc/logos/bitcoin-btc-logo.png"
                                    class="bitcoin-history-logo"
                                    alt="Bitcoin"
                                >

                            </div>


                            <div class="website-history-info">

                                <h3>
                                    Bitcoin
                                </h3>

                                <p>

                                    ${transactionTitle}

                                    <span>•</span>

                                    <span class="history-status ${status.toLowerCase() === "completed" ? "active" : "pending"}">
                                        ${status}
                                    </span>

                                </p>

                                <small>
                                    ${formattedDate}
                                </small>

                            </div>

                        </div>


                        <div class="website-history-right">

                            <strong
                                class="${colorClass}"
                                style="color: ${isBuy ? '#ef4444' : ''} !important;"
                            >

                                ${sign}$${formattedAmount}

                            </strong>
                            
                            <i
                                class="fa-solid fa-chevron-down history-chevron"
                            ></i>

                        </div>

                    </div>


                    <div class="website-history-details">

                        <div class="history-details-title">

                            Bitcoin Trade Details

                        </div>


                        <div class="website-detail-row">

                            <span>
                                Transaction
                            </span>

                            <strong>
                                ${isBuy ? "Buy Bitcoin" : "Sell Bitcoin"}
                            </strong>

                        </div>


                        <div class="website-detail-row">

                            <span>
                                Amount
                            </span>

                            <strong class="${colorClass}">
                                ${sign}$${formattedAmount}
                            </strong>

                        </div>


                        <div class="website-detail-row">

                            <span>
                                BTC ${isBuy ? "Received" : "Sold"}
                            </span>

                            <strong>
                                ${btcAmount.toFixed(8)} BTC
                            </strong>

                        </div>


                        <div class="website-detail-row">

                            <span>
                                Bitcoin Price
                            </span>

                            <strong>
                                $${bitcoinPrice.toLocaleString("en-US", {
                                    minimumFractionDigits: 2,
                                    maximumFractionDigits: 2
                                })}
                            </strong>

                        </div>


                        <div class="website-detail-row">

                            <span>
                                Status
                            </span>

                            <strong>
                                ${status}
                            </strong>

                        </div>


                        <div class="website-detail-row">

                            <span>
                                Date
                            </span>

                            <strong>
                                ${formattedDate}
                            </strong>

                        </div>

                    </div>

                </div>

                `;

                return;

            }


            // =========================================
            // INVESTMENT
            // =========================================

            const investmentAmount =
                Number(transaction.amount) || 0;


            const investmentFormatted =
                investmentAmount.toLocaleString("en-US", {

                    minimumFractionDigits: 2,

                    maximumFractionDigits: 2

                });


            const status =
                transaction.status || "Pending";


            const statusClass =
                status.toLowerCase() === "active"
                    ? "active"
                    : "pending";


            container.innerHTML += `

            <div class="website-history-item">

                <div
                    class="website-history-header"
                    onclick="toggleHistory(this)"
                >

                    <div class="website-history-left">

                        <div class="website-history-icon">

                            <i class="fa-solid fa-chart-line"></i>

                        </div>


                        <div class="website-history-info">

                            <h3>
                                ${transaction.plan || "Investment"}
                            </h3>

                            <p>

                                Investment

                                <span>•</span>

                                <span class="history-status ${statusClass}">
                                    ${status}
                                </span>

                            </p>

                            <small>
                                ${formattedDate}
                            </small>

                        </div>

                    </div>


                    <div class="website-history-right">

                        <strong class="history-amount">

                            +$${investmentFormatted}

                        </strong>


                        <i
                            class="fa-solid fa-chevron-down history-chevron"
                        ></i>

                    </div>

                </div>


                <div class="website-history-details">

                    <div class="history-details-title">

                        Investment Details

                    </div>


                    <div class="website-detail-row">

                        <span>
                            Investment Plan
                        </span>

                        <strong>
                            ${transaction.plan || "Investment"}
                        </strong>

                    </div>


                    <div class="website-detail-row">

                        <span>
                            Amount
                        </span>

                        <strong>
                            $${investmentFormatted}
                        </strong>

                    </div>


                    <div class="website-detail-row">

                        <span>
                            Status
                        </span>

                        <strong class="history-status ${statusClass}">
                            ${status}
                        </strong>

                    </div>


                    <div class="website-detail-row">

                        <span>
                            Date
                        </span>

                        <strong>
                            ${formattedDate}
                        </strong>

                    </div>


                    <div class="website-detail-row">

                        <span>
                            Monthly Return
                        </span>

                        <strong>
                            ${transaction.profitRate || 0}%
                        </strong>

                    </div>

                </div>

            </div>

            `;

        });


        console.log(
            "All transaction history loaded:",
            transactions
        );


    } catch (error) {

        console.error(
            "Error loading transaction history:",
            error
        );


        container.innerHTML = `

            <div class="empty-history">

                <div class="empty-history-icon">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                </div>

                <h3>
                    Unable to Load History
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}

// =========================================
// EXPAND / COLLAPSE
// =========================================

window.toggleHistory = function(header) {

    const item =
        header.parentElement;


    const details =
        item.querySelector(
            ".website-history-details"
        );


    const chevron =
        header.querySelector(
            ".history-chevron"
        );


    if (!details) return;


    details.classList.toggle("active");


    if (chevron) {

        chevron.classList.toggle("rotate");

    }

};


// =========================================
// WAIT FOR FIREBASE LOGIN
// =========================================

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


onAuthStateChanged(auth, function(user) {

    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    loadHistory(user);

});

</script>

<script>

// Load saved theme
const savedTheme = localStorage.getItem("theme");

if (savedTheme === "light") {
    document.body.classList.add("light-mode");
} else {
    document.body.classList.remove("light-mode");
}

</script>

</body>

</html>
