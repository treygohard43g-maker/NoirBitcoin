<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - NoirBitcoin</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="settings-container">

    <h2><i class="fa-solid fa-user-gear"></i> Account Settings</h2>

    <div class="settings-card">

        <label>Username</label>
        <input type="text" id="newUsername" placeholder="Enter new username">

    <label>Current Password</label>

<div class="password-field">
    <input type="password" id="oldPassword" placeholder="Enter current password">
    <i class="fa-solid fa-eye" id="toggleOldPassword"></i>
</div>

<label>New Password</label>

<div class="password-field">
    <input type="password" id="newPassword" placeholder="Enter new password">
    <i class="fa-solid fa-eye" id="toggleNewPassword"></i>
</div>

<label>Confirm New Password</label>

<div class="password-field">
    <input type="password" id="confirmPassword" placeholder="Confirm new password">
    <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>
</div>

<button id="saveSettings">
    <i class="fa-solid fa-floppy-disk"></i>
    Save Changes
</button>

<button id="themeToggle">
    <i class="fa-solid fa-moon"></i>
    Dark Mode
</button>

</div>
    

<div class="settings-card">

    <div class="setting-row">

        <div class="setting-label">
            <i class="fa-solid fa-moon"></i>
            <span>Dark Mode</span>
        </div>

        <label class="switch">
            <input type="checkbox" id="themeToggle" checked>
            <span class="slider"></span>
        </label>

    </div>

</div>
    
        
        <button onclick="window.location.href='dashboard.html'">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
