<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NoirBitcoin Support</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body class="support-page">

    <!-- SUPPORT HEADER -->

    <header class="support-header">

        <button
            class="support-back"
            onclick="window.location.href='dashboard.html'">

            <i class="fa-solid fa-chevron-left"></i>

        </button>

        <div class="support-title">

            <div class="support-icon">
                <i class="fa-regular fa-comments"></i>
            </div>

            <div>

                <h1>NoirBitcoin Support</h1>

                <span>
                    <i class="fa-solid fa-circle"></i>
                    Support available
                </span>

            </div>

        </div>

    </header>


    <!-- CHAT AREA -->

    <main class="support-chat">

        <div
            id="chatMessages"
            class="chat-messages">
        </div>
<!-- PHOTO PREVIEW -->

<div
    id="photoPreview"
    class="photo-preview"
    style="display:none;"
>

    <img
        id="photoPreviewImage"
        src=""
        alt="Selected photo"
    >

    <button
        id="removePhotoBtn"
        type="button"
        aria-label="Remove photo"
    >
        <i class="fa-solid fa-xmark"></i>
    </button>

</div>


<!-- MESSAGE INPUT -->

<div class="chat-input-area">

    <button
        id="photoBtn"
        class="chat-photo-btn"
        type="button"
        aria-label="Send photo">

        <i class="fa-solid fa-camera"></i>

    </button>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        hidden>

    <input
        type="text"
        id="chatInput"
        placeholder="Type your message..."
        autocomplete="off">

    <button
        id="sendMessageBtn"
        type="button"
        aria-label="Send message">

        <i class="fa-solid fa-arrow-up"></i>

    </button>

</div>

    <!-- PHOTO / CAMERA BUTTON -->

    <button
        id="photoBtn"
        class="chat-photo-btn"
        type="button"
        aria-label="Send photo">

        <i class="fa-solid fa-camera"></i>

    </button>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        hidden>

    <input
        type="text"
        id="chatInput"
        placeholder="Type your message..."
        autocomplete="off">

    <button
        id="sendMessageBtn"
        type="button"
        aria-label="Send message">

        <i class="fa-solid fa-arrow-up"></i>

    </button>

    </div>
 </main>

 <script type="module" src="support.js"></script>

<!-- SUPPORT IMAGE VIEWER -->

<div
    id="supportImageViewer"
    class="support-image-viewer"
>

    <button
        id="closeSupportImage"
        class="close-support-image"
        type="button"
        aria-label="Close image"
    >
        <i class="fa-solid fa-xmark"></i>
    </button>

    <img
        id="supportFullImage"
        src=""
        alt="Full size support image"
    >

</div>

</body>
</html>
