<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NoirBitcoin - Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

<h1>NOIRBITCOIN</h1>

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Email Address"
required>


<input
type="password"
id="loginPassword"
placeholder="Password"
required>


<button type="submit">
Login
</button>

</form>


<p>

Don't have an account?

<a href="register.html">
Register
</a>

</p>


</div>


<script src="script.js"></script>

</body>

</html>
