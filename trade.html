<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trade | NoirBitcoin</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1117;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.trade-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 18px 40px;
}

.trade-header {
    margin-bottom: 20px;
}

.trade-header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
}

.trade-header p {
    margin: 6px 0 0;
    color: #8b949e;
    font-size: 14px;
}

.market-card,
.trade-card {
    background: linear-gradient(145deg, #1b1e24, #181c22);
    border: 1px solid #2a2f38;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
}

.market-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.market-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.coin-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #f7931a;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
}

.market-info h2 {
    margin: 0;
    font-size: 17px;
}

.market-info span {
    display: block;
    margin-top: 3px;
    color: #8b949e;
    font-size: 12px;
}

.market-price {
    text-align: right;
}

.market-price strong {
    display: block;
    font-size: 17px;
}

.market-price span {
    display: block;
    margin-top: 4px;
    color: #8b949e;
    font-size: 12px;
}

.trade-card label {
    display: block;
    margin-bottom: 9px;
    color: #8b949e;
    font-size: 13px;
}

.amount-input {
    display: flex;
    align-items: center;
    background: #0d1117;
    border: 1px solid #2a2f38;
    border-radius: 12px;
    padding: 0 14px;
    height: 52px;
}

.amount-input span {
    color: #8b949e;
    margin-right: 8px;
}

.amount-input input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #ffffff;
    font-size: 16px;
}

.trade-buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
}

.trade-buttons button {
    flex: 1;
    height: 50px;
    border: none;
    border-radius: 12px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.buy-btn {
    background: #16803c;
}

.sell-btn {
    background: #b42318;
}

.trade-buttons button:active {
    transform: scale(0.98);
}

@media (max-width: 480px) {

    .trade-container {
        padding: 20px 14px 30px;
    }

    .market-card {
        padding: 15px;
    }

    .trade-card {
        padding: 15px;
    }

}

.chart-card {
    background: linear-gradient(145deg, #1b1e24, #181c22);
    border: 1px solid #2a2f38;
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 16px;
    overflow: hidden;
}

.chart-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.chart-top strong {
    display: block;
    font-size: 15px;
}

.chart-top span {
    display: block;
    color: #8b949e;
    font-size: 11px;
    margin-top: 3px;
}

.chart-timeframes {
    display: flex;
    gap: 4px;
}

.chart-timeframes button {
    background: transparent;
    border: none;
    color: #8b949e;
    font-size: 11px;
    padding: 5px 6px;
    border-radius: 6px;
}

.chart-timeframes button.active {
    background: #2a2f38;
    color: #ffffff;
}

#tradeChart {
    width: 100%;
    height: 360px;
}

</style>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

    <div class="trade-container">

    <div class="trade-header">
        <h1>Trade</h1>
        <p>Markets</p>
    </div>

    <div class="market-card">

        <div class="market-info">
            <div class="coin-icon">₿</div>

            <div>
                <h2>Bitcoin</h2>
                <span>BTC</span>
            </div>
        </div>

        <div class="market-price">
            <strong id="btcPrice">Loading...</strong>
            <span id="btcChange">--</span>
        </div>

    </div>

<div class="chart-card">

    <div class="chart-top">

        <div>
            <strong>BTC / USD</strong>
            <span>Bitcoin</span>
        </div>

        <div class="chart-timeframes">
            <button>1H</button>
            <button>4H</button>
            <button class="active">1D</button>
            <button>1W</button>
        </div>

    </div>

    <div id="tradeChart"></div>

</div>

    <div class="trade-card">

        <label for="tradeAmount">Amount</label>

        <div class="amount-input">
            <span>$</span>
            <input
                type="number"
                id="tradeAmount"
                placeholder="0.00"
                min="0"
                step="0.01"
            >
        </div>

        <div class="trade-buttons">

            <button id="buyBtn" class="buy-btn">
                Buy
            </button>

            <button id="sellBtn" class="sell-btn">
                Sell
            </button>

        </div>

    </div>

</div>

<script>

async function loadBTCMarket() {

    try {

        const response = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"
        );

        const data = await response.json();

        const price = data.bitcoin.usd;
        const change = data.bitcoin.usd_24h_change;

        document.getElementById("btcPrice").textContent =
            "$" + price.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        document.getElementById("btcChange").textContent =
            (change >= 0 ? "+" : "") +
            change.toFixed(2) +
            "% today";

    } catch (error) {

        console.error("Unable to load BTC market:", error);

        document.getElementById("btcPrice").textContent =
            "Unavailable";

        document.getElementById("btcChange").textContent =
            "Try again later";

    }

}

loadBTCMarket();

setInterval(loadBTCMarket, 30000);

// =========================
// BTC TRADING CANDLESTICK CHART
// =========================

const chartContainer = document.getElementById("tradeChart");

const tradeChart = LightweightCharts.createChart(chartContainer, {
    width: chartContainer.clientWidth,
    height: 360,

    layout: {
        background: {
            color: "#181c22"
        },
        textColor: "#8b949e"
    },

    grid: {
        vertLines: {
            color: "#222831"
        },
        horzLines: {
            color: "#222831"
        }
    },

    rightPriceScale: {
        borderColor: "#2a2f38"
    },

    timeScale: {
        borderColor: "#2a2f38",
        timeVisible: true,
        secondsVisible: false
    }
});

const candleSeries = tradeChart.addCandlestickSeries({
    upColor: "#16803c",
    downColor: "#b42318",
    borderUpColor: "#16803c",
    borderDownColor: "#b42318",
    wickUpColor: "#16803c",
    wickDownColor: "#b42318"
});

async function loadTradingChart() {

    try {

        const response = await fetch(
            "https://api.coingecko.com/api/v3/coins/bitcoin/ohlc?vs_currency=usd&days=1"
        );

        const data = await response.json();

        const candles = data.map(item => ({
            time: Math.floor(item[0] / 1000),
            open: item[1],
            high: item[2],
            low: item[3],
            close: item[4]
        }));

        candleSeries.setData(candles);

        tradeChart.timeScale().fitContent();

    } catch (error) {

        console.error(
            "Unable to load Bitcoin trading chart:",
            error
        );

    }

}

loadTradingChart();

window.addEventListener("resize", () => {

    tradeChart.applyOptions({
        width: chartContainer.clientWidth
    });

});

</script>

</body>

</html>
