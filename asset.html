<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asset | NoirBitcoin</title>


    <!-- =========================
         LIGHTWEIGHT CHARTS
    ========================== -->

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            background: #0d1117;

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

        }


        /* =========================
           PAGE
        ========================== */

        .asset-page {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding: 30px 20px 50px;

        }


        /* =========================
           BACK BUTTON
        ========================== */

        .back-btn {

            width: 78px;

            height: 78px;

            border: none;

            border-radius: 22px;

            background: #1b1e24;

            color: #ffffff;

            font-size: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            margin-bottom: 35px;

            transition: 0.2s ease;

        }


        .back-btn:active {

            transform: scale(0.95);

        }


        /* =========================
           ASSET HEADER
        ========================== */

        #assetHeader {

            min-height: 110px;

            display: flex;

            align-items: center;

            gap: 18px;

            margin-bottom: 25px;

        }


        #assetHeader img {

            width: 72px;

            height: 72px;

            object-fit: contain;

            flex-shrink: 0;

        }


        .asset-name {

            font-size: 30px;

            font-weight: 700;

            line-height: 1.2;

        }


        .asset-symbol {

            margin-top: 5px;

            color: #8b949e;

            font-size: 15px;

            font-weight: 500;

            text-transform: uppercase;

        }


        .asset-price {

            margin-top: 10px;

            color: #f59e0b;

            font-size: 25px;

            font-weight: 700;

        }


        /* =========================
           CHART CARD
        ========================== */

        .chart-card {

            width: 100%;

            height: 320px;

            background: #1b1e24;

            border-radius: 24px;

            overflow: hidden;

            margin-bottom: 25px;

            padding: 10px;

        }


        #chart {

            width: 100%;

            height: 300px;

        }


        /* =========================
           STATS
        ========================== */

        #assetStats {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;

            margin-bottom: 30px;

        }


        .stat-card {

            background: #181c22;

            border: 1px solid #2a2f38;

            border-radius: 18px;

            padding: 18px;

            min-height: 95px;

        }


        .stat-title {

            color: #8b949e;

            font-size: 13px;

            margin-bottom: 9px;

        }


        .stat-value {

            color: #ffffff;

            font-size: 17px;

            font-weight: 600;

            word-break: break-word;

        }


        /* =========================
           INVEST BUTTON
        ========================== */

        .invest-btn {

            width: 100%;

            height: 95px;

            border: none;

            border-radius: 24px;

            background: #f59e0b;

            color: #ffffff;

            font-size: 25px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .invest-btn:active {

            transform: scale(0.98);

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .asset-page {

                padding:
                    30px 32px 50px;

            }


            .back-btn {

                width: 78px;

                height: 78px;

                margin-bottom: 35px;

            }


            #assetHeader {

                min-height: 100px;

                gap: 15px;

            }


            #assetHeader img {

                width: 62px;

                height: 62px;

            }


            .asset-name {

                font-size: 26px;

            }


            .asset-price {

                font-size: 22px;

            }


            .chart-card {

                height: 320px;

                border-radius: 22px;

            }


            #assetStats {

                gap: 12px;

            }


            .stat-card {

                padding: 15px;

            }


            .stat-value {

                font-size: 15px;

            }


            .invest-btn {

                height: 95px;

                font-size: 24px;

            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================== */

        @media (max-width: 380px) {

            .asset-page {

                padding-left: 20px;

                padding-right: 20px;

            }


            .asset-name {

                font-size: 23px;

            }


            .asset-price {

                font-size: 20px;

            }


            .stat-title {

                font-size: 12px;

            }


            .stat-value {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


    <main class="asset-page">


        <!-- =========================
             BACK
        ========================== -->

        <button
            class="back-btn"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>


        <!-- =========================
             ASSET INFORMATION
        ========================== -->

        <section id="assetHeader">

            <div style="
                color:#8b949e;
                padding:20px;
            ">
                Loading asset...
            </div>

        </section>


        <!-- =========================
             CHART
        ========================== -->

        <section class="chart-card">

            <div id="chart"></div>

        </section>


        <!-- =========================
             STATISTICS
        ========================== -->

        <section id="assetStats">


            <div class="stat-card">

                <div class="stat-title">
                    Market Cap
                </div>

                <div class="stat-value">
                    Loading...
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    24h Change
                </div>

                <div class="stat-value">
                    Loading...
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Volume
                </div>

                <div class="stat-value">
                    Loading...
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Rank
                </div>

                <div class="stat-value">
                    Loading...
                </div>

            </div>


        </section>


        <!-- =========================
             INVEST
        ========================== -->

        <button
            class="invest-btn"
        >
            Invest
        </button>


    </main>


    <!-- =========================
         ASSET JAVASCRIPT
    ========================== -->

    <script src="asset.js"></script>


</body>

</html>
