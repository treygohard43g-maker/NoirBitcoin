<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asset | NoirBitcoin</title>

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #0d1117;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .asset-page {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px 50px;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            border: 1px solid #2a2f38;
            border-radius: 15px;
            background: #181c22;
            color: #ffffff;
            font-size: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 28px;
        }

        #assetHeader {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 82px;
            margin-bottom: 20px;
        }

        #assetHeader img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .asset-name {
            font-size: 27px;
            font-weight: 700;
        }

        .asset-symbol {
            margin-top: 4px;
            color: #8b949e;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .asset-price {
            margin-top: 7px;
            font-size: 24px;
            font-weight: 700;
        }

        .chart-card {
            width: 100%;
            height: 350px;
            background: #11161d;
            border: 1px solid #222831;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 22px;
            padding: 8px 4px 4px;
        }

        #chart {
            width: 100%;
            height: 335px;
        }

        .section-title {
            margin: 4px 0 13px;
            font-size: 18px;
            font-weight: 700;
        }

        #assetStats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: linear-gradient(145deg, #1b1e24, #15191f);
            border: 1px solid #2a2f38;
            border-radius: 17px;
            padding: 17px;
            min-height: 92px;
        }

        .stat-title {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #ffffff;
            font-size: 16px;
            font-weight: 650;
            word-break: break-word;
        }

        .asset-info {
            margin-bottom: 22px;
            background: linear-gradient(145deg, #1b1e24, #15191f);
            border: 1px solid #2a2f38;
            border-radius: 18px;
            padding: 19px;
        }

        /* =========================
   ABOUT ASSET BUTTON
========================= */

.asset-info-title {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: #ffffff;

    font-size: 17px;
    font-weight: 700;

    line-height: 1.3;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition:
        opacity 0.2s ease;
}


/* Press effect */

.asset-info-title:active {
    opacity: 0.65;
}


/* =========================
   ARROW
========================= */

.about-asset-arrow {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 30px;
    height: 30px;

    flex-shrink: 0;

    margin-left: 15px;

    border-radius: 50%;

    background: rgba(255,255,255,0.06);

    color: #8b949e;

    font-size: 13px;

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
}

        .asset-description {
            color: #9da5af;
            font-size: 14px;
            line-height: 1.65;
        }

        .supply-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }

        .supply-item {
            background: #15191f;
            border: 1px solid #252b34;
            border-radius: 15px;
            padding: 14px;
        }

        .supply-label {
            color: #8b949e;
            font-size: 11px;
            margin-bottom: 7px;
        }

        .supply-value {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .asset-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 5px;
        }

        .asset-action,
        .invest-btn {
            height: 58px;
            border-radius: 17px;
            border: 1px solid #2a2f38;
            background: #181c22;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .asset-action:active,
        .invest-btn:active {
            transform: scale(0.97);
        }

        .invest-btn {
            width: 100%;
            margin-top: 12px;
        }

        @media (max-width: 600px) {

            .asset-page {
                padding: 20px 16px 40px;
            }

            .back-btn {
                width: 46px;
                height: 46px;
                margin-bottom: 22px;
            }

            .asset-name {
                font-size: 24px;
            }

            .asset-price {
                font-size: 21px;
            }

            .chart-card {
                height: 315px;
                border-radius: 20px;
            }

            #chart {
                height: 305px;
            }

            .stat-card {
                padding: 14px;
                min-height: 88px;
            }

            .stat-value {
                font-size: 15px;
            }

            .supply-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* =========================
   PREMIUM WATCHLIST
========================= */

#watchlistBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
}

#watchlistBtn .watchlist-star {
    font-size: 19px;
    line-height: 1;
    color: #8b949e;
    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

/* Active watchlist */

#watchlistBtn.watchlisted {
    border-color: rgba(245, 185, 66, 0.45);
    background: rgba(245, 185, 66, 0.08);
}

#watchlistBtn.watchlisted .watchlist-star {
    color: #f5b942;
    transform: scale(1.08);
}

/* Press effect */

#watchlistBtn:active {
    transform: scale(0.96);
}


/* =========================
   WATCHLIST TOAST
========================= */

.watchlist-toast {
    position: fixed;

    left: 50%;
    bottom: 28px;

    transform: translate(-50%, 20px);

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 13px 18px;

    background: rgba(24, 28, 34, 0.96);

    border: 1px solid #2a2f38;

    border-radius: 14px;

    color: #ffffff;

    font-size: 14px;
    font-weight: 600;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.45);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    z-index: 9999;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;
}


/* Show toast */

.watchlist-toast.show {
    opacity: 1;
    visibility: visible;

    transform:
        translate(-50%, 0);
}


/* Toast icon */

.watchlist-toast i {
    color: #f5b942;
    font-size: 16px;
}


/* Mobile */

@media (max-width: 600px) {

    .watchlist-toast {
        bottom: 22px;

        width: max-content;
        max-width: calc(100% - 32px);

        padding: 12px 16px;

        font-size: 13px;
    }

}

    </style>

</head>

<body>

    <main class="asset-page">

        <button
            class="back-btn"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>

        <section id="assetHeader">

            <div style="color:#8b949e;">
                Loading asset...
            </div>

        </section>

        <section class="chart-card">

            <div id="chart"></div>

        </section>

        <div class="section-title">
            Market Statistics
        </div>

        <section id="assetStats">

            <div class="stat-card">
                <div class="stat-title">Market Cap</div>
                <div class="stat-value">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">24h Change</div>
                <div class="stat-value">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">24h Volume</div>
                <div class="stat-value">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Market Rank</div>
                <div class="stat-value">Loading...</div>
            </div>

        </section>
        
       <section class="asset-info">

    <button
        type="button"
        class="asset-info-title"
        onclick="toggleAboutAsset()"
        aria-expanded="false"
    >
        <span>About this asset</span>

        <span
            class="about-asset-arrow"
            id="aboutAssetArrow"
        >
            ▾
        </span>
    </button>

    <div
        id="assetDescription"
        class="asset-description"
        hidden
    >
        Loading asset information...
    </div>

</section>
    
        <div class="section-title">
            Supply
        </div>

        <section class="supply-grid">

            <div class="supply-item">
                <div class="supply-label">
                    Circulating Supply
                </div>

                <div
                    id="circulatingSupply"
                    class="supply-value"
                >
                    Loading...
                </div>
            </div>

            <div class="supply-item">
                <div class="supply-label">
                    Total Supply
                </div>

                <div
                    id="totalSupply"
                    class="supply-value"
                >
                    Loading...
                </div>
            </div>

            <div class="supply-item">
                <div class="supply-label">
                    Max Supply
                </div>

                <div
                    id="maxSupply"
                    class="supply-value"
                >
                    Loading...
                </div>
            </div>

        </section>

        <section class="asset-actions">

            <button
                class="asset-action"
                onclick="investAsset()"
            >
                Invest
            </button>

          <button
    id="watchlistBtn"
    class="asset-action watchlist-btn"
    onclick="addToWatchlist()"
>
    <span class="watchlist-star">☆</span>
    <span class="watchlist-text">Watchlist</span>
</button>

        </section>

        <button
            class="invest-btn"
            onclick="investAsset()"
        >
            Invest in this asset
        </button>

    </main>

    <script src="asset.js?v=3"></script>

</body>

</html>
