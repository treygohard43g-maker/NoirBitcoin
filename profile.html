<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NoirBitcoin Profile</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   NOIRBITCOIN PROFILE PAGE
========================= */

.profile-page {

    min-height: 100vh;

    padding: 18px 18px 40px;

    box-sizing: border-box;

}


/* ---------- HEADER ---------- */

.profile-header {

    height: 58px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    position: relative;

    box-sizing: border-box;

}

.profile-back-btn {

    width: 40px;

    height: 40px;

    border-radius: 50%;

    border: 1px solid #2A2F38;

    background: #181C22;

    color: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 15px;

    transition: 0.2s ease;

}

.profile-back-btn:active {

    transform: scale(0.94);

}

.profile-header h1 {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    margin: 0;

    font-size: 18px;

    font-weight: 600;

    letter-spacing: 0.2px;

    color: #ffffff;

}


/* ---------- PROFILE CARD ---------- */

.profile-card {

    width: 100%;

    max-width: 520px;

    margin: 18px auto 0;

    padding: 34px 22px 30px;

    box-sizing: border-box;

    text-align: center;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            #1B1E24,
            #15181D
        );

    border: 1px solid #2A2F38;

    box-shadow:
        0 18px 45px rgba(0,0,0,0.28);

}


/* ---------- PHOTO ---------- */

.profile-photo-wrapper {

    display: flex;

    justify-content: center;

    margin-bottom: 18px;

    padding-top: 4px;

}

.profile-photo {

    width: 118px;

    height: 118px;

    border-radius: 50%;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            #242932,
            #12151A
        );

    border: 3px solid #2A2F38;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);

}


/* Profile image */

#profilePhoto {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: none;

}


/* Placeholder */

#profilePhotoPlaceholder {

    color: #8b949e;

    font-size: 38px;

}


/* Camera badge */

.profile-photo-camera {

    position: absolute;

    right: 3px;

    bottom: 3px;

    width: 34px;

    height: 34px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f59e0b;

    color: #111;

    border: 3px solid #181C22;

    font-size: 13px;

}


/* ---------- NAME ---------- */

#profileDisplayName {

    margin: 4px 0 7px;

    color: #ffffff;

    font-size: 22px;

    font-weight: 600;

    letter-spacing: -0.3px;

}


/* ---------- EMAIL ---------- */

#profileDisplayEmail {

    margin: 0;

    color: #8b949e;

    font-size: 14px;

    font-weight: 400;

    word-break: break-word;

}


/* ---------- CHANGE PHOTO BUTTON ---------- */

.change-photo-btn {

    margin-top: 25px;

    width: 100%;

    max-width: 260px;

    height: 46px;

    border: 1px solid rgba(245,158,11,0.35);

    border-radius: 13px;

    background:
        rgba(245,158,11,0.08);

    color: #f59e0b;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;

}

.change-photo-btn i {

    margin-right: 8px;

}

.change-photo-btn:active {

    transform: scale(0.97);

}


/* ---------- MOBILE ---------- */

@media (max-width: 480px) {

    .profile-page {

        padding-left: 14px;

        padding-right: 14px;

    }

    .profile-card {

        margin-top: 12px;

        padding: 30px 18px 26px;

        border-radius: 21px;

    }

    .profile-photo {

        width: 108px;

        height: 108px;

    }

    #profileDisplayName {

        font-size: 20px;

    }

}

/* =========================
   PROFILE INFORMATION
========================= */

.profile-info-list {

    margin-top: 28px;

    width: 100%;

    border-top: 1px solid #2A2F38;

}


.profile-info-row {

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 15px 2px;

    border-bottom: 1px solid #2A2F38;

    text-align: left;

}


.profile-info-icon {

    width: 36px;

    height: 36px;

    min-width: 36px;

    border-radius: 11px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(245,158,11,0.08);

    color: #f59e0b;

    font-size: 14px;

}


.profile-info-text {

    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 3px;

}


.profile-info-text span {

    color: #8b949e;

    font-size: 11px;

    font-weight: 500;

    text-transform: uppercase;

    letter-spacing: 0.6px;

}


.profile-info-text strong {

    color: #ffffff;

    font-size: 14px;

    font-weight: 500;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


/* =========================
   SETTINGS BUTTON
========================= */

.profile-settings-btn {

    margin-top: 20px;

    width: 100%;

    min-height: 48px;

    padding: 0 15px;

    box-sizing: border-box;

    border-radius: 13px;

    border: 1px solid #2A2F38;

    background: #181C22;

    color: #ffffff;

    text-decoration: none;

    display: flex;

    align-items: center;

    gap: 11px;

    font-size: 14px;

    font-weight: 500;

}


.profile-settings-btn i:first-child {

    color: #f59e0b;

}


.profile-settings-btn i:last-child {

    margin-left: auto;

    color: #6b7280;

    font-size: 12px;

}

/* =========================
   FLAT PROFILE SURFACE
========================= */

.profile-card {

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

    border-radius: 0 !important;

    padding-left: 0 !important;
    padding-right: 0 !important;

}


/* Remove the surrounding line around account information */

.profile-info-list {

    border-top: none !important;

}


/* Keep the individual information rows subtle */

.profile-info-row {

    border-bottom: 1px solid rgba(42, 47, 56, 0.65);

}


/* Make the profile page feel like one surface */

.profile-page {

    background: transparent;

}

/* =========================
   PREMIUM PROFILE ROWS
========================= */

.profile-info-list {
    margin-top: 26px;
    width: 100%;
}

.profile-info-row {
    min-height: 58px;
    padding: 12px 0;
    display: flex;
    align-items: center;
    gap: 14px;
    box-sizing: border-box;
}

.profile-info-icon {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(245, 158, 11, 0.07);
    color: #f59e0b;

    font-size: 14px;
}

.profile-info-text {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;
    gap: 4px;
}

.profile-info-text span {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: #6b7280;
}

.profile-info-text strong {
    font-size: 14px;
    font-weight: 500;
    color: #f5f5f5;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* Protected status */

.profile-info-row:last-child
.profile-info-text strong {
    color: #22c55e;
}

/* =========================
   PREMIUM ACCOUNT SETTINGS
========================= */

.profile-settings-btn {
    margin-top: 22px;

    width: 100%;
    min-height: 52px;

    padding: 0 16px;

    display: flex;
    align-items: center;
    gap: 12px;

    box-sizing: border-box;

    background: rgba(255,255,255,0.025) !important;

    border: 1px solid rgba(255,255,255,0.07) !important;

    border-radius: 14px;

    color: #f5f5f5;

    text-decoration: none;

    font-size: 14px;
    font-weight: 500;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

.profile-settings-btn i:first-child {
    color: #f59e0b;
}

.profile-settings-btn i:last-child {
    margin-left: auto;
    color: #6b7280;
    font-size: 12px;
}

.profile-settings-btn:active {
    transform: scale(0.98);
}

</style>

</head>


<body>


<header class="profile-header">

    <button
        class="profile-back-btn"
        type="button"
        onclick="window.location.href='dashboard.html'"
        aria-label="Back"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <h1>Profile</h1>

</header>



<main class="profile-page">

    <section class="profile-card">


        <!-- PROFILE PHOTO -->

        <div class="profile-photo-wrapper">

            <label
                for="profilePhotoInput"
                class="profile-photo"
            >

                <img
                    id="profilePhoto"
                    src=""
                    alt="Profile photo"
                >

                <div id="profilePhotoPlaceholder">

                    <i class="fa-solid fa-user"></i>

                </div>


                <div class="profile-photo-camera">

                    <i class="fa-solid fa-camera"></i>

                </div>

            </label>


            <input
                type="file"
                id="profilePhotoInput"
                accept="image/*"
                hidden
            >

        </div>


        <!-- USER NAME -->

        <h2 id="profileDisplayName">
            User
        </h2>


        <!-- USER EMAIL -->

        <p id="profileDisplayEmail">
            —
        </p>


        <!-- CHANGE PHOTO -->

        <button
            class="change-photo-btn"
            type="button"
            onclick="document.getElementById('profilePhotoInput').click()"
        >

            <i class="fa-solid fa-camera"></i>

            Change Profile Photo

        </button>

      <!-- ACCOUNT INFORMATION -->

<div class="profile-info-list">

    <div class="profile-info-row">

        <div class="profile-info-icon">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="profile-info-text">

            <span>Name</span>

            <strong id="profileInfoName">
                User
            </strong>

        </div>

    </div>


    <div class="profile-info-row">

        <div class="profile-info-icon">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="profile-info-text">

            <span>Email</span>

            <strong id="profileInfoEmail">
                —
            </strong>

        </div>

    </div>


    <div class="profile-info-row">

        <div class="profile-info-icon">
            <i class="fa-solid fa-fingerprint"></i>
        </div>

        <div class="profile-info-text">

            <span>Account ID</span>

            <strong id="profileInfoId">
                —
            </strong>

        </div>

    </div>


    <div class="profile-info-row">

        <div class="profile-info-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="profile-info-text">

            <span>Security</span>

            <strong>Protected</strong>

        </div>

    </div>

</div>


<a
    href="settings.html"
    class="profile-settings-btn"
>

    <i class="fa-solid fa-gear"></i>

    Account Settings

    <i class="fa-solid fa-chevron-right"></i>

</a>
      
    </section>

</main>


<script type="module" src="script.js"></script>

</body>

</html>
